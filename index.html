<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GBC-Style Tribute — Pat's Adventure</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.55.2/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html,body { 
      height: 100%; 
      width: 100%;
      margin: 0; 
      background: #12121a; 
      font-family: monospace; 
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      position: fixed;
    }
    #game-wrapper { 
      width: 320px; 
      height: 288px; 
      margin: 10px auto; 
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
    }
    canvas { 
      image-rendering: pixelated !important;
      image-rendering: crisp-edges !important;
      -ms-interpolation-mode: nearest-neighbor !important;
    }
    .dpad, .btnA, .btnB {
      position: fixed; 
      opacity: 0.7; 
      touch-action: none; 
      user-select: none; 
      -webkit-user-select: none;
      z-index: 1000;
      pointer-events: auto;
    }
    .dpad { 
      left: 20px; 
      bottom: 80px; 
      width: 120px; 
      height: 120px; 
      position: relative;
    }
    .btnA { 
      right: 20px; 
      bottom: 80px; 
      width: 60px; 
      height: 60px; 
      border-radius: 50%; 
      background: #2f7bd9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .btnB { 
      right: 100px; 
      bottom: 120px; 
      width: 50px; 
      height: 50px; 
      border-radius: 50%; 
      background: #d14a4a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .dpad .dir { 
      position: absolute; 
      background: #999; 
      border-radius: 10%; 
      opacity: 0.85;
      pointer-events: auto;
    }
    .dpad .up { left: 40px; top: 0; width: 40px; height: 35px; } 
    .dpad .down { left: 40px; bottom: 0; width: 40px; height: 35px; }
    .dpad .left { left: 0; top: 40px; width: 35px; height: 40px; } 
    .dpad .right { right: 0; top: 40px; width: 35px; height: 40px; }
    #hint { 
      color: #dfe6e9; 
      text-align: center; 
      margin-top: 4px; 
      font-size: 11px;
      padding: 0 10px;
    }
    .small { 
      font-size: 10px; 
      color: #cfe8ff; 
      text-align: center; 
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
  <div id="game-wrapper"></div>
  <div class="small">Player: Pat — Tribute (fan-made, original assets)</div>
  <div id="hint">Use controls to move — [A] Interact / [B] Menu</div>

  <div class="dpad" id="dpad">
    <div class="dir up" id="up"></div>
    <div class="dir down" id="down"></div>
    <div class="dir left" id="left"></div>
    <div class="dir right" id="right"></div>
  </div>
  <div class="btnA" id="btnA">A</div>
  <div class="btnB" id="btnB">B</div>

<script>
const TILE = 16;
const SCREEN_W = 160 * 2;
const SCREEN_H = 144 * 2;
const config = { 
  type: Phaser.AUTO,
  parent: 'game-wrapper', 
  width: SCREEN_W, 
  height: SCREEN_H, 
  backgroundColor: 0x88c0ff, 
  pixelArt: true,
  roundPixels: true,
  antialias: false,
  physics: { default: 'arcade' }, 
  scene: { preload, create, update },
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  }
};

let game;
let gameScene;
let player, cursors;
let creatures = [];
let npcs = [];
let items = [];
let currentMapKey = 'overworld';
let currentMapData;
let playerPosBeforeEnter = null;
let inputLocked = false;
let renderTexture;

const collectionData = [];
const inventoryData = { stones: [] };

const maps = {
  overworld: [
    'TTTTTTTTTTTTTTTTTTTT',
    'T..................T',
    'T..C....g...S..N...T',
    'T..g..WWW..g...g...T',
    'T..g..W.W..g..C....T',
    'T..g..WWW..g.......T',
    'T.......g....g..D..T',
    'T..C....g....g.....T',
    'T.......g....g..C..T',
    'T..S........g......T',
    'T......BBBBBBBB....T',
    'TTTTTTTDDDDDTTTTTTT'
  ],
  house_small: [
    'BBBBBBBBBBBB',
    'B..........B',
    'B..S..N....B',
    'B..........B',
    'BD.........B',
    'BBBBBBBBBBBB'
  ]
};

const palette = {
  B: 0x304352, '.': 0xcff0d6, g: 0x77bb6d, W: 0x3f8fe2,
  T: 0x2c5b2e, D: 0xffd27f, N: 0xcfe3ff, C: 0xefd275, S: 0xffb7c5
};

function makePixelTexture(scene, key, pixels, scale=2) {
  const sizeY = pixels.length, sizeX = pixels[0].length;
  const tex = scene.textures.createCanvas(key, sizeX*scale, sizeY*scale);
  const ctx = tex.getContext();
  for (let y=0;y<sizeY;y++){
    for (let x=0;x<sizeX;x++){
      const c = pixels[y][x];
      if (!c) continue;
      ctx.fillStyle = c;
      ctx.fillRect(x*scale, y*scale, scale, scale);
    }
  }
  tex.refresh();
}

function createSprites(scene) {
  makePixelTexture(scene, 'pat', [
    [null,'#0f2b4c','#0f2b4c','#0f2b4c','#0f2b4c',null],
    ['#0f2b4c','#77a6d9','#77a6d9','#77a6d9','#77a6d9','#0f2b4c'],
    [null,null,'#77a6d9','#77a6d9','#77a6d9',null],
    [null,null,null,'#f1c27d','#f1c27d',null],
    [null,null,'#e04a4a',null,null,'#e04a4a'],
    [null,'#e04a4a',null,null,null,'#e04a4a']
  ], 2);

  makePixelTexture(scene, 'crea_base', [
    [null,'#a7d67b','#a7d67b','#a7d67b',null],
    ['#a7d67b','#ffffff','#ffffff','#ffffff','#a7d67b'],
    [null,'#ffffff','#7a9b4b','#ffffff',null],
    [null,null,'#7a9b4b',null,null]
  ], 3);

  makePixelTexture(scene, 'hakim_base', [
    [null,'#f0d2a4','#f0d2a4','#f0d2a4',null],
    ['#f0d2a4','#8a5d3a','#8a5d3a','#8a5d3a','#f0d2a4'],
    [null,'#8a5d3a','#fff0d6','#8a5d3a',null],
    [null,null,'#fff0d6',null,null]
  ], 3);

  makePixelTexture(scene, 'npc', [
    [null,'#ffd7b0','#ffd7b0',null],
    ['#ffd7b0','#6c4f3a','#6c4f3a','#ffd7b0'],
    [null,null,'#ffd7b0',null]
  ], 3);
}

function drawMap(scene, mapKey) {
  currentMapKey = mapKey;
  currentMapData = maps[mapKey];
  
  creatures.forEach(c => {
    if (c.sprite) {
      if (c.sprite.moveTimer) c.sprite.moveTimer.remove(false);
      c.sprite.destroy();
    }
  });
  creatures = [];
  
  npcs.forEach(n => n.sprite && n.sprite.destroy());
  npcs = [];
  
  items.forEach(it => it.sprite && it.sprite.destroy());
  items = [];

  const mapW = currentMapData[0].length;
  const mapH = currentMapData.length;
  const pxW = mapW * TILE;
  const pxH = mapH * TILE;

  if (renderTexture) { 
    renderTexture.destroy(); 
    renderTexture = null; 
  }
  renderTexture = scene.add.renderTexture(0, 0, pxW, pxH).setOrigin(0).setDepth(0);
  
  for (let y=0;y<mapH;y++){
    for (let x=0;x<mapW;x++){
      const ch = currentMapData[y][x];
      const col = palette[ch] || palette['.'];
      const g = scene.make.graphics({x:0,y:0,add:false});
      g.fillStyle(col,1);
      g.fillRect(0,0,TILE,TILE);
      renderTexture.draw(g, x*TILE, y*TILE);
      g.destroy();
      
      const b = scene.make.graphics({x:0,y:0,add:false});
      b.lineStyle(1, 0x000000, 0.08);
      b.strokeRect(0,0,TILE,TILE);
      renderTexture.draw(b, x*TILE, y*TILE);
      b.destroy();

      if (ch === 'C') {
        const types = ['generic','hakim_hunt'];
        const type = Phaser.Utils.Array.GetRandom(types);
        spawnCreature(scene, x, y, type);
      } else if (ch === 'N') {
        spawnNPC(scene, x, y);
      } else if (ch === 'S') {
        spawnItem(scene, x, y, 'stone_spot');
      }
    }
  }

  scene.physics.world.setBounds(0,0,pxW,pxH);
  scene.cameras.main.setBounds(0,0,pxW,pxH);
}

function spawnCreature(scene, gx, gy, type) {
  let key = 'crea_base';
  let species = 'Dibbly';
  let level = Phaser.Math.Between(2,6);
  if (type === 'hakim_hunt') { 
    key = 'hakim_base'; 
    species = 'Hakim Jefrees'; 
    level = Phaser.Math.Between(2,5); 
  }
  const x = gx*TILE + TILE/2;
  const y = gy*TILE + TILE/2;
  const spr = scene.add.sprite(x,y,key).setScale(1).setDepth(3);
  spr.gridX = gx; 
  spr.gridY = gy; 
  spr.type = type; 
  spr.species = species; 
  spr.level = level;
  
  scene.tweens.add({ 
    targets: spr, 
    y: spr.y - 3, 
    duration: 900 + Math.random()*800, 
    yoyo:true, 
    repeat:-1, 
    ease:'Sine.easeInOut' 
  });
  
  spr.moveTimer = scene.time.addEvent({ 
    delay: 2000 + Math.random()*4000, 
    loop: true, 
    callback: ()=>{
      if (inputLocked) return;
      if (Math.random() < 0.5) return;
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      const d = Phaser.Utils.Array.GetRandom(dirs);
      const nx = spr.gridX + d[0], ny = spr.gridY + d[1];
      if (isWalkableTile(nx,ny)) {
        spr.gridX = nx; 
        spr.gridY = ny;
        scene.tweens.add({ 
          targets: spr, 
          x: nx*TILE + TILE/2, 
          y: ny*TILE + TILE/2, 
          duration: 300, 
          ease:'Power2' 
        });
      }
    }
  });
  creatures.push({ sprite: spr, species, level, type, key });
}

function spawnNPC(scene, gx, gy) {
  const x = gx*TILE + TILE/2; 
  const y = gy*TILE + TILE/2;
  const spr = scene.add.sprite(x,y,'npc').setScale(1.5).setDepth(4);
  spr.gridX = gx; 
  spr.gridY = gy;
  
  const dialogs = [
    ["Yo Pat! The Wi-Fi here is terrible, but the vibes are good."],
    ["Have you tried the new ramen truck? 10/10 would recommend."],
    ["I do data science. My hobby is training tiny beasts!"]
  ];
  
  const giveStone = Math.random() < 0.4;
  const stoneType = giveStone ? Phaser.Utils.Array.GetRandom(['fire','water','volt']) : null;
  npcs.push({ sprite: spr, dialogs, giveStone, stoneType, given:false });
}

function spawnItem(scene, gx, gy, subtype) {
  const x = gx*TILE + TILE/2; 
  const y = gy*TILE + TILE/2;
  const g = scene.add.circle(x, y, TILE/3, 0xffb7c5).setDepth(2);
  items.push({ sprite: g, gx, gy, subtype });
}

function isWalkableTile(gx, gy) {
  if (!currentMapData) return false;
  if (gy < 0 || gy >= currentMapData.length || gx < 0 || gx >= currentMapData[0].length) return false;
  const ch = currentMapData[gy][gx];
  return ['.','g','D','C','S','N'].includes(ch);
}

function tileCenter(gx,gy) { 
  return { x: gx*TILE + TILE/2, y: gy*TILE + TILE/2 }; 
}

function findFirstWalkableTile(mapData) {
  for (let y=0;y<mapData.length;y++) {
    for (let x=0;x<mapData[0].length;x++) {
      if (['.','g','D','C','S','N'].includes(mapData[y][x])) return {x,y};
    }
  }
  return {x:1,y:1};
}

function preload() {}

function create() {
  gameScene = this;
  createSprites(this);
  drawMap(this, 'overworld');

  const start = findFirstWalkableTile(currentMapData);
  const px = start.x*TILE + TILE/2, py = start.y*TILE + TILE/2;
  player = this.physics.add.sprite(px, py, 'pat').setDepth(5).setScale(1.2);
  player.gridX = start.x; 
  player.gridY = start.y;
  player.moving = false;
  this.cameras.main.centerOn(player.x, player.y);

  cursors = this.input.keyboard.createCursorKeys();
  this.input.keyboard.addKeys('W,A,S,D');

  this.info = this.add.text(6, SCREEN_H - 28, '', { 
    font: '10px monospace', 
    fill: '#061a2a', 
    backgroundColor:'#cff0ff' 
  }).setDepth(20).setScrollFactor(0);
  
  updateInfo();
  setupControls();
}

function setupControls() {
  let touchHandlers = [];
  
  const createTouchHandler = (elementId, callback) => {
    const el = document.getElementById(elementId);
    if (!el) return;
    
    const handler = (e) => {
      e.preventDefault();
      e.stopPropagation();
      callback();
    };
    
    el.addEventListener('touchstart', handler, { passive: false });
    el.addEventListener('click', handler);
    touchHandlers.push({ el, handler });
  };

  createTouchHandler('up', () => stepTo(0, -1));
  createTouchHandler('down', () => stepTo(0, 1));
  createTouchHandler('left', () => stepTo(-1, 0));
  createTouchHandler('right', () => stepTo(1, 0));
  createTouchHandler('btnA', () => interact());
  createTouchHandler('btnB', () => openMenu());

  window.addEventListener('keydown', (e) => {
    if (inputLocked || player.moving) return;
    
    switch(e.key.toLowerCase()) {
      case 'arrowup': case 'w': stepTo(0,-1); break;
      case 'arrowdown': case 's': stepTo(0,1); break;
      case 'arrowleft': case 'a': stepTo(-1,0); break;
      case 'arrowright': case 'd': stepTo(1,0); break;
      case 'z': case ' ': interact(); break;
      case 'x': openMenu(); break;
    }
  });
}

function stepTo(dx,dy) {
  if (inputLocked || player.moving) return;
  const nx = player.gridX + dx, ny = player.gridY + dy;
  if (!isWalkableTile(nx,ny)) {
    flashTemporary("Blocked!");
    return;
  }
  player.moving = true;
  player.gridX = nx; 
  player.gridY = ny;
  const dest = tileCenter(nx,ny);
  gameScene.tweens.add({ 
    targets: player, 
    x: dest.x, 
    y: dest.y, 
    duration: 150, 
    ease: 'Power2', 
    onComplete: ()=>{
      player.moving=false; 
      gameScene.cameras.main.centerOn(player.x, player.y); 
      onEnterTile(nx,ny);
    }
  });
}

function onEnterTile(gx,gy) {
  const ch = currentMapData[gy][gx];
  if (ch === 'D') {
    if (currentMapKey === 'overworld') {
      playerPosBeforeEnter = { mapKey: currentMapKey, x: gx, y: gy };
      drawMap(gameScene, 'house_small');
      const insideTile = {x: 1, y: 3};
      player.gridX = insideTile.x; 
      player.gridY = insideTile.y;
      const dest = tileCenter(player.gridX, player.gridY);
      player.x = dest.x; 
      player.y = dest.y;
      gameScene.cameras.main.centerOn(player.x, player.y);
      updateInfo();
    } else {
      const prev = playerPosBeforeEnter || { mapKey:'overworld', x:3, y:6 };
      drawMap(gameScene, prev.mapKey);
      player.gridX = prev.x; 
      player.gridY = prev.y + 1;
      const dest = tileCenter(player.gridX, player.gridY);
      player.x = dest.x; 
      player.y = dest.y;
      gameScene.cameras.main.centerOn(player.x, player.y);
      updateInfo();
    }
  }

  const foundItemIndex = items.findIndex(it => it.gx === gx && it.gy === gy);
  if (foundItemIndex >= 0) {
    const it = items[foundItemIndex];
    if (it.subtype === 'stone_spot') {
      const stone = Phaser.Utils.Array.GetRandom(['fire','water','volt']);
      inventoryData.stones.push(stone);
      it.sprite.destroy();
      items.splice(foundItemIndex,1);
      flashTemporary(`Found a ${stone} stone!`);
      updateInfo();
    }
  }
}

function interact() {
  if (inputLocked) return;
  
  for (let i=0;i<creatures.length;i++){
    const c = creatures[i];
    const d = Math.abs(c.sprite.gridX - player.gridX) + Math.abs(c.sprite.gridY - player.gridY);
    if (d <= 1) {
      startEncounter(c, i);
      return;
    }
  }
  
  for (let i=0;i<npcs.length;i++){
    const n = npcs[i];
    const d = Math.abs(n.sprite.gridX - player.gridX) + Math.abs(n.sprite.gridY - player.gridY);
    if (d <= 1) {
      talkToNPC(n);
      return;
    }
  }
  
  flashTemporary("Nothing nearby.");
}

function startEncounter(creatureObj, index) {
  inputLocked = true;
  const spr = creatureObj.sprite;
  
  const overlay = gameScene.add.rectangle(0,0, SCREEN_W, SCREEN_H, 0x000000, 0.6).setOrigin(0).setDepth(50).setScrollFactor(0);
  const panel = gameScene.add.rectangle(8, SCREEN_H-60, SCREEN_W-16, 56, 0xf8f8f8, 1).setOrigin(0).setDepth(51).setScrollFactor(0);
  const title = gameScene.add.text(12, SCREEN_H-56, `${spr.species} Lv ${spr.level}`, { 
    font:'10px monospace', 
    fill:'#000' 
  }).setDepth(52).setScrollFactor(0);
  const info = gameScene.add.text(12, SCREEN_H-40, "Throw Ball [A]  Run [B]", { 
    font:'9px monospace', 
    fill:'#000' 
  }).setDepth(52).setScrollFactor(0);

  let cleanupDone = false;
  let handlers = [];
  
  function cleanup() {
    if (cleanupDone) return;
    cleanupDone = true;
    overlay.destroy(); 
    panel.destroy(); 
    title.destroy(); 
    info.destroy();
    handlers.forEach(h => h.el.removeEventListener(h.type, h.fn));
    handlers = [];
    inputLocked = false;
  }
  
  function attemptCapture() {
    if (cleanupDone) return;
    const base = spr.species === 'Hakim Jefrees' ? 0.45 : 0.5;
    const levelFactor = Math.max(0, (8 - spr.level) * 0.04);
    const chance = Phaser.Math.Clamp(base + levelFactor - Math.random()*0.15, 0.05, 0.95);
    info.setText("You throw a ball...");
    gameScene.time.delayedCall(700, ()=>{
      if (cleanupDone) return;
      if (Math.random() < chance) {
        info.setText(`${spr.species} was captured!`);
        const entry = { 
          species: spr.species, 
          level: spr.level, 
          id: Date.now(), 
          xp: 0 
        };
        if (spr.species === 'Hakim Jefrees') entry.element = 'neutral';
        collectionData.push(entry);
        
        if (spr.moveTimer) spr.moveTimer.remove(false);
        spr.destroy();
        creatures.splice(index,1);
        gameScene.time.delayedCall(900, ()=>{ 
          cleanup(); 
          updateInfo(); 
        });
      } else {
        info.setText("It broke free!");
        gameScene.time.delayedCall(700, cleanup);
      }
    });
  }

  function onRun() {
    if (cleanupDone) return;
    info.setText("You ran away!");
    gameScene.time.delayedCall(300, cleanup);
  }

  const addHandler = (id, type, fn) => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener(type, fn, { passive: false });
      handlers.push({ el, type, fn });
    }
  };

  const captureHandler = (e) => { e.preventDefault(); attemptCapture(); };
  const runHandler = (e) => { e.preventDefault(); onRun(); };
  
  addHandler('btnA', 'touchstart', captureHandler);
  addHandler('btnA', 'click', captureHandler);
  addHandler('btnB', 'touchstart', runHandler);
  addHandler('btnB', 'click', runHandler);
}

function talkToNPC(npc) {
  inputLocked = true;
  const dialogLines = Phaser.Utils.Array.Shuffle([...npc.dialogs])[0];
  let idx = 0;
  
  const overlay = gameScene.add.rectangle(0,0, SCREEN_W, SCREEN_H, 0x000000, 0.55).setOrigin(0).setDepth(60).setScrollFactor(0);
  const panel = gameScene.add.rectangle(8, SCREEN_H-70, SCREEN_W-16, 66, 0xfafafa, 1).setOrigin(0).setDepth(61).setScrollFactor(0);
  const nameTxt = gameScene.add.text(12, SCREEN_H-66, `NPC`, {
    font:'10px monospace', 
    fill:'#000'
  }).setDepth(62).setScrollFactor(0);
  const body = gameScene.add.text(12, SCREEN_H-52, dialogLines[idx] || "Hey.", {
    font:'9px monospace', 
    fill:'#000'
  }).setDepth(62).setScrollFactor(0);
  const hint = gameScene.add.text(SCREEN_W-70, SCREEN_H-34, "[A] Next", {
    font:'9px monospace', 
    fill:'#333'
  }).setDepth(62).setScrollFactor(0);

  let cleanupDone = false;
  let handlers = [];

  function advance() {
    if (cleanupDone) return;
    idx++;
    if (idx < dialogLines.length) { 
      body.setText(dialogLines[idx]); 
    } else {
      finish();
    }
  }
  
  function finish() {
    if (cleanupDone) return;
    if (npc.giveStone && !npc.given) {
      const stone = npc.stoneType;
      inventoryData.stones.push(stone);
      npc.given = true;
      body.setText(`Take this ${stone} stone!`);
      gameScene.time.delayedCall(1200, ()=>{ 
        close(); 
        updateInfo(); 
      });
      return;
    }
    close();
  }
  
  function close() { 
    if (cleanupDone) return;
    cleanupDone = true;
    overlay.destroy(); 
    panel.destroy(); 
    nameTxt.destroy(); 
    body.destroy(); 
    hint.destroy(); 
    handlers.forEach(h => h.el.removeEventListener(h.type, h.fn));
    handlers = [];
    inputLocked = false;
  }

  const addHandler = (id, type, fn) => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener(type, fn, { passive: false });
      handlers.push({ el, type, fn });
    }
  };

  const advanceHandler = (e) => { e.preventDefault(); advance(); };
  
  addHandler('btnA', 'touchstart', advanceHandler);
  addHandler('btnA', 'click', advanceHandler);
  addHandler('btnB', 'touchstart', advanceHandler);
  addHandler('btnB', 'click', advanceHandler);
}

function flashTemporary(txt) {
  if (!gameScene || !gameScene.info) return;
  gameScene.info.setText(txt);
  gameScene.time.delayedCall(1100, updateInfo);
}

function updateInfo() {
  if (!gameScene || !gameScene.info) return;
  const stones = inventoryData.stones.length;
  const col = collectionData.length;
  gameScene.info.setText(`Pat  •  Collected: ${col}  •  Stones: ${stones}`);
}

function openMenu() {
  if (inputLocked) return;
  inputLocked = true;
  
  const overlay = gameScene.add.rectangle(0,0, SCREEN_W, SCREEN_H, 0x000000, 0.7).setOrigin(0).setDepth(80).setScrollFactor(0);
  const panel = gameScene.add.rectangle(6,6, SCREEN_W-12, SCREEN_H-12, 0xfdfdfd, 1).setOrigin(0).setDepth(81).setScrollFactor(0);
  const title = gameScene.add.text(12,10, "PAT'S MENU", {
    font:'11px monospace', 
    fill:'#000'
  }).setDepth(82).setScrollFactor(0);
  
  const listItems = [];
  for (let i=0;i<Math.min(8,collectionData.length);i++){
    const it = collectionData[i];
    const txt = gameScene.add.text(12, 30 + i*14, `${i+1}. ${it.species} Lv ${it.level} ${it.element ? '['+it.element+']' : ''}`, {
      font:'10px monospace', 
      fill:'#000'
    }).setDepth(82).setScrollFactor(0);
    txt.setInteractive();
    txt.on('pointerdown', ()=>{ attemptUseStoneOn(i); });
    listItems.push(txt);
  }
  
  if (collectionData.length === 0) {
    const emptyTxt = gameScene.add.text(12, 30, "No creatures yet. Catch some!", {
      font:'10px monospace', 
      fill:'#000'
    }).setDepth(82).setScrollFactor(0);
    listItems.push(emptyTxt);
  }

  const stonesTxt = gameScene.add.text(12, SCREEN_H-56, `Stones: ${inventoryData.stones.join(', ') || 'None'}`, {
    font:'10px monospace', 
    fill:'#000'
  }).setDepth(82).setScrollFactor(0);
  listItems.push(stonesTxt);
  
  const closeHint = gameScene.add.text(SCREEN_W-88, SCREEN_H-28, "[A/B] Close", {
    font:'10px monospace', 
    fill:'#333'
  }).setDepth(82).setScrollFactor(0);
  listItems.push(closeHint);

  let cleanupDone = false;
  let handlers = [];

  function close() { 
    if (cleanupDone) return;
    cleanupDone = true;
    overlay.destroy(); 
    panel.destroy(); 
    title.destroy(); 
    listItems.forEach(item => item.destroy());
    handlers.forEach(h => h.el.removeEventListener(h.type, h.fn));
    handlers = [];
    inputLocked = false; 
    updateInfo();
  }
  
  const addHandler = (id, type, fn) => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener(type, fn, { passive: false });
      handlers.push({ el, type, fn });
    }
  };

  const closeHandler = (e) => { e.preventDefault(); close(); };
  
  addHandler('btnA', 'touchstart', closeHandler);
  addHandler('btnA', 'click', closeHandler);
  addHandler('btnB', 'touchstart', closeHandler);
  addHandler('btnB', 'click', closeHandler);

  function attemptUseStoneOn(index) {
    if (cleanupDone) return;
    if (index < 0 || index >= collectionData.length) { 
      flashTemporary("Invalid selection."); 
      return; 
    }
    const chosen = collectionData[index];
    if (chosen.species !== 'Hakim Jefrees') { 
      flashTemporary("Only Hakim Jefrees can use stones."); 
      return; 
    }
    if (inventoryData.stones.length === 0) { 
      flashTemporary("No stones available."); 
      return; 
    }
    
    const stone = inventoryData.stones.shift();
    chosen.element = stone;
    collectionData[index] = chosen;
    
    const promptOverlay = gameScene.add.rectangle(18, SCREEN_H/2 - 26, SCREEN_W-36, 52, 0xffffff, 1).setDepth(90).setScrollFactor(0);
    const promptText = gameScene.add.text(22, SCREEN_H/2 - 18, `${chosen.species} is infused with ${stone} energy!`, {
      font:'9px monospace', 
      fill:'#000'
    }).setDepth(91).setScrollFactor(0);
    
    gameScene.time.delayedCall(1200, ()=>{ 
      promptOverlay.destroy(); 
      promptText.destroy(); 
      updateInfo(); 
      close();
    });
  }
}

function update(time, delta) {
  if (gameScene && player && !inputLocked) {
    gameScene.cameras.main.centerOn(player.x, player.y);
  }
}

// Start the game when DOM is ready
window.addEventListener('load', () => {
  game = new Phaser.Game(config);
});
