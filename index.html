<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GBC-Style Monster Tribute (Pokémon Blue inspired) - Playable on Android</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    /* GBC-ish background + fit/scale for mobile (integer-friendly scaling) */
    html,body { height:100%; margin:0; background:#1b1b2f; font-family: monospace; -webkit-tap-highlight-color: transparent; }
    #game-wrapper { width: 160px; height: 144px; margin: 18px auto; image-rendering: pixelated; }
    canvas { image-rendering: pixelated !important; }
    /* On-screen controls */
    .dpad, .btnA, .btnB {
      position: fixed;
      opacity: 0.85;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .dpad { left: 6vw; bottom: 12vw; width: 24vw; height: 24vw; }
    .btnA { right: 6vw; bottom: 12vw; width: 18vw; height: 18vw; border-radius: 50%; background: #2f7bd9; }
    .btnB { right: 22vw; bottom: 20vw; width: 12vw; height: 12vw; border-radius: 50%; background: #d14a4a; }
    .dpad .dir { position:absolute; background:#999; border-radius:10%; opacity:0.7; }
    .dpad .up { left:33%; top:0; width:34%; height:30%; }
    .dpad .down { left:33%; bottom:0; width:34%; height:30%; }
    .dpad .left { left:0; top:33%; width:30%; height:34%; }
    .dpad .right { right:0; top:33%; width:30%; height:34%; }
    /* UI overlay */
    #hint { color:#dfe6e9; text-align:center; margin-top:6px; font-size:12px; }
    .ui-panel { position: absolute; left:0; top:0; pointer-events:none; color:#fff; }
    .small { font-size:10px; }
  </style>
</head>
<body>
  <div id="game-wrapper"></div>
  <div id="hint">Use the D-Pad (or arrows) and A (right blue) to interact — designed for Android browsers</div>

  <!-- On-screen D-Pad -->
  <div class="dpad" id="dpad" aria-hidden="true">
    <div class="dir up" data-dir="up"></div>
    <div class="dir down" data-dir="down"></div>
    <div class="dir left" data-dir="left"></div>
    <div class="dir right" data-dir="right"></div>
  </div>
  <div class="btnA" id="btnA" aria-hidden="true"></div>
  <div class="btnB" id="btnB" aria-hidden="true"></div>

<script>
/*
  GBC-Style "tribute" engine. This is an original, small demo inspired by
  the tile/grid movement and simple catch/battle ideas from handheld monster RPGs.
  IMPORTANT LEGAL NOTE (see below): no official Pokémon assets, names, or code are used.
*/

/* --- Config --- */
const TILE = 16;              // small "GBC pixel" tile
const SCREEN_W = 160;         // original Game Boy width
const SCREEN_H = 144;         // original Game Boy height
const SCALE_TO = 3;           // initial scale; browser will scale further to fit

const config = {
  type: Phaser.CANVAS,
  parent: 'game-wrapper',
  width: SCREEN_W,
  height: SCREEN_H,
  backgroundColor: 0x7aa2ff,
  pixelArt: true,
  physics: { default: 'arcade' },
  scene: { preload, create, update }
};
let game = new Phaser.Game(config);

/* --- Map (simple) --- */
const rawMap = [
  'GGGGGGGGGGGGGGGGGG',
  'G................G',
  'G....WWW...T.....G',
  'G....W.W...T.....G',
  'G....WWW...T.....G',
  'G................G',
  'G..S.............G',
  'G................G',
  'G......C.......C.G',
  'G................G',
  'G................G',
  'GGGGGGGGGGGGGGGGGG'
];

const pal = {
  G: 0x3aa76a, // grass
  W: 0x2f86c3, // water
  T: 0x7ba05d, // tree/forest
  S: 0xd8c76b, // sign / special
  C: 0xffcc66, // creature spawn tile
  '.': 0x93a2a8  // path / floor
};

/* --- Game state --- */
let player, cursors;
let moveQueue = null; // queued grid movement when stepping
let creatures;        // array of creatures on map
let uiText;
let inputLocked = false;

/* Simple "pokedex" saved to localStorage under key 'tribute_collection' */
function loadCollection() {
  try { return JSON.parse(localStorage.getItem('tribute_collection') || '[]'); }
  catch(e){ return []; }
}
function saveCollection(list) {
  try { localStorage.setItem('tribute_collection', JSON.stringify(list)); } catch(e){}
}

/* Generate small pixel-art textures for player/monsters at runtime */
function makePixelTexture(scene, key, pixels, scale=1) {
  const size = pixels.length;
  const canvas = scene.textures.createCanvas(key, size*scale, size*scale);
  const ctx = canvas.getContext();
  for (let y=0;y<size;y++){
    for (let x=0;x<size;x++){
      const c = pixels[y][x];
      if (!c) continue;
      ctx.fillStyle = c;
      ctx.fillRect(x*scale, y*scale, scale, scale);
    }
  }
  canvas.refresh();
}

/* --- Phaser lifecycle --- */
function preload() {
  // nothing external required; we create textures at runtime
}

function create() {
  const scene = this;
  // create textures (tiny 8x8 sprites)
  // player (blue jacket)
  makePixelTexture(this, 'player', [
    [null,'#0b2b4b','#0b2b4b','#0b2b4b','#0b2b4b','#0b2b4b',null,null],
    ['#0b2b4b','#7f9fbf','#7f9fbf','#7f9fbf','#7f9fbf','#7f9fbf','#0b2b4b',null],
    [null,null,'#7f9fbf','#7f9fbf','#7f9fbf','#7f9fbf',null,null],
    [null,null,null,'#f1c27d','#f1c27d',null,null,null],
    [null,null,'#d14a4a',null,null,'#d14a4a',null,null],
    [null,'#d14a4a',null,null,null,null,'#d14a4a',null],
    [null,null,'#a23f3f','#a23f3f','#a23f3f','#a23f3f',null,null],
    [null,null,null,null,null,null,null,null]
  ], 2);

  // generic creature sprite variations
  makePixelTexture(this, 'creature_green', [
    [null,null,'#7bd67b','#7bd67b','#7bd67b',null,null,null],
    [null,'#7bd67b','#9ff39f','#9ff39f','#9ff39f','#7bd67b',null,null],
    [null,'#7bd67b','#9ff39f','#2f7b2f','#9ff39f','#7bd67b',null,null],
    [null,'#7bd67b','#9ff39f','#9ff39f','#9ff39f','#7bd67b',null,null],
    [null,null,'#7bd67b','#7bd67b','#7bd67b',null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null]
  ],2);

  makePixelTexture(this, 'creature_red', [
    [null,null,'#ff9b9b','#ff9b9b','#ff9b9b',null,null,null],
    [null,'#ff9b9b','#ffdad6','#ffdad6','#ffdad6','#ff9b9b',null,null],
    [null,'#ff9b9b','#ffdad6','#6b1616','#ffdad6','#ff9b9b',null,null],
    [null,'#ff9b9b','#ffdad6','#ffdad6','#ffdad6','#ff9b9b',null,null],
    [null,null,'#ff9b9b','#ff9b9b','#ff9b9b',null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null]
  ],2);

  // draw map using graphics on a render texture for crisp pixels
  const mapWidth = rawMap[0].length;
  const mapHeight = rawMap.length;
  const rt = this.add.renderTexture(0,0, mapWidth*TILE, mapHeight*TILE).setOrigin(0);
  for (let y=0;y<mapHeight;y++){
    for (let x=0;x<mapWidth;x++){
      const ch = rawMap[y][x];
      const color = pal[ch] || pal['.'];
      const g = this.make.graphics({x:0,y:0,add:false});
      g.fillStyle(color,1);
      g.fillRect(0,0,TILE,TILE);
      rt.draw(g, x*TILE, y*TILE);
      g.destroy();
      // optional tile border for readability
      const border = this.make.graphics({x:0,y:0,add:false});
      border.lineStyle(1, 0x2b2b2b, 0.2);
      border.strokeRect(0,0,TILE,TILE);
      rt.draw(border, x*TILE, y*TILE);
      border.destroy();
    }
  }

  // world bounds based on rendered map
  this.physics.world.setBounds(0,0, mapWidth*TILE, mapHeight*TILE);

  // player: start near top-left open area (tile coords)
  const startX = 2 * TILE + TILE/2;
  const startY = 2 * TILE + TILE/2;
  player = this.physics.add.sprite(startX, startY, 'player').setOrigin(0.5).setScale(1).setDepth(5);
  player.gridX = Math.round(startX / TILE);
  player.gridY = Math.round(startY / TILE);
  player.setCollideWorldBounds(true);
  player.body.setSize(12,12);
  player.moving = false;

  // create creatures at 'C' tiles
  creatures = [];
  for (let y=0;y<mapHeight;y++){
    for (let x=0;x<mapWidth;x++){
      if (rawMap[y][x] === 'C') {
        const choice = Math.random() < 0.5 ? 'creature_green' : 'creature_red';
        const spr = this.add.sprite(x*TILE + TILE/2, y*TILE + TILE/2, choice).setScale(1).setDepth(4);
        spr.gridX = x; spr.gridY = y;
        spr.species = (choice === 'creature_green') ? 'Blupluff' : 'Reddim'; // original names
        spr.level = Phaser.Math.Between(2,8);
        creatures.push(spr);
      }
    }
  }

  // camera to fixed game viewport (no move)
  this.cameras.main.setBounds(0,0,mapWidth*TILE,mapHeight*TILE);
  this.cameras.main.centerOn(player.x, player.y);

  cursors = this.input.keyboard.createCursorKeys();
  // also support WASD
  this.input.keyboard.addKeys('W,A,S,D');

  // UI text overlay (small)
  uiText = this.add.text(4, SCREEN_H - 18, '', { font: '9px monospace', fill:'#062a3a', backgroundColor:'#d6efff' }).setDepth(10).setScrollFactor(0);

  // input handlers: A button
  this.input.keyboard.on('keydown-SPACE', () => { interact(scene); });
  this.input.keyboard.on('keydown-Z', () => { interact(scene); }); // common A key
  // menu key (B)
  this.input.keyboard.on('keydown-X', () => { openCollection(scene); });

  // on-screen D-pad and buttons (connect to DOM)
  attachTouchControls(this);

  // show collection count
  updateUI();
}

/* --- Helpers & Mechanics --- */

/* check collision/walkable - simple: only 'G','.' and 'C','S' walkable; W/T/G border denote obstacles */
function isWalkable(x,y) {
  if (y < 0 || y >= rawMap.length || x < 0 || x >= rawMap[0].length) return false;
  const ch = rawMap[y][x];
  return ch !== 'W' && ch !== 'T' && ch !== 'G'; // Note: edges 'G' used as border in our map, treat as wall
}

/* Convert grid coords to pixel center */
function tileCenter(x,y) {
  return { x: x*TILE + TILE/2, y: y*TILE + TILE/2 };
}

/* Attempt to move one tile in given direction (grid) */
function tryWalk(dx,dy,scene) {
  if (player.moving || inputLocked) return;
  const nx = player.gridX + dx;
  const ny = player.gridY + dy;
  if (!isWalkable(nx,ny)) {
    // bump text
    flashText(scene, "Blocked!");
    return;
  }
  player.moving = true;
  player.gridX = nx; player.gridY = ny;
  const dest = tileCenter(nx,ny);
  scene.tweens.add({
    targets: player,
    x: dest.x,
    y: dest.y,
    duration: 160,
    ease: 'Power2',
    onComplete: ()=> { player.moving = false; scene.cameras.main.centerOn(player.x, player.y); }
  });
}

/* Check for creature adjacent and start interaction */
function interact(scene) {
  if (inputLocked) return;
  // find creature adjacent (manhattan dist = 1) or same tile
  for (let i=0;i<creatures.length;i++){
    const c = creatures[i];
    const d = Math.abs(c.gridX - player.gridX) + Math.abs(c.gridY - player.gridY);
    if (d <= 1) {
      startBattle(scene, c, i);
      return;
    }
  }
  // check sign tiles (S)
  const ch = rawMap[player.gridY][player.gridX];
  if (ch === 'S') {
    flashText(scene, "Sign: Welcome to Blue Coast!");
  } else {
    flashText(scene, "Nothing here.");
  }
}

/* Very small turn-based encounter: user can throw a "ball" to try capture */
function startBattle(scene, creatureSprite, creatureIndex) {
  inputLocked = true;
  // overlay
  const overlay = scene.add.rectangle(0,0, SCREEN_W, SCREEN_H, 0x000000, 0.65).setOrigin(0).setDepth(20);
  const panel = scene.add.rectangle(8, SCREEN_H-56, SCREEN_W-16, 48, 0xfafafa, 1).setOrigin(0,0).setDepth(21);
  const nameText = scene.add.text(12, SCREEN_H-52, `${creatureSprite.species}  Lv ${creatureSprite.level}`, {font:'10px monospace', fill:'#000'}).setDepth(22);
  const infoText = scene.add.text(12, SCREEN_H-36, "What will you do?", {font:'9px monospace', fill:'#000'}).setDepth(22);

  // options: Ball (A), Run (B)
  const btnBall = scene.add.text(SCREEN_W - 70, SCREEN_H-46, '[A] Ball', {font:'10px monospace', fill:'#0a5'}).setDepth(22);
  const btnRun  = scene.add.text(SCREEN_W - 70, SCREEN_H-30, '[B] Run', {font:'10px monospace', fill:'#a33'}).setDepth(22);

  // local handlers for keys and touch
  function cleanup() {
    overlay.destroy(); panel.destroy(); nameText.destroy(); infoText.destroy(); btnBall.destroy(); btnRun.destroy();
    inputLocked = false;
  }

  // simple capture chance formula influenced by level
  function attemptCapture() {
    const base = 0.5; // base 50%
    const levelFactor = Math.max(0, (12 - creatureSprite.level) * 0.03); // higher chance on low level
    const chance = Phaser.Math.Clamp(base + levelFactor - Math.random()*0.2, 0.05, 0.95);
    infoText.setText("You throw a ball...");
    scene.time.delayedCall(800, ()=>{
      if (Math.random() < chance) {
        // captured
        infoText.setText(`${creatureSprite.species} was captured!`);
        // add to collection
        const col = loadCollection();
        col.push({ species: creatureSprite.species, level: creatureSprite.level, id: Date.now() });
        saveCollection(col);
        // remove from map
        creatureSprite.destroy();
        creatures.splice(creatureIndex,1);
        scene.time.delayedCall(900, ()=>{
          cleanup();
          updateUI();
        });
      } else {
        infoText.setText("Oh no! It broke free!");
        scene.time.delayedCall(700, ()=>{
          cleanup();
        });
      }
    });
  }

  // keyboard
  function onKeyDown(e) {
    if (!inputLocked) return;
    if (e.key === 'z' || e.key === 'Z' || e.key === ' ' || e.code === 'Space') {
      attemptCapture();
    } else if (e.key === 'x' || e.key === 'X') {
      infoText.setText("You ran away!");
      scene.time.delayedCall(400, cleanup);
    }
  }
  window.addEventListener('keydown', onKeyDown);

  // on-screen button touch
  const onTouchA = () => attemptCapture();
  const onTouchB = () => { infoText.setText("You ran away!"); scene.time.delayedCall(400, cleanup); };

  document.getElementById('btnA').addEventListener('touchstart', onTouchA, { passive: true });
  document.getElementById('btnB').addEventListener('touchstart', onTouchB, { passive: true });

  // also add a click handler just in case
  btnBall.setInteractive().on('pointerdown', attemptCapture);
  btnRun.setInteractive().on('pointerdown', ()=>{ infoText.setText("You ran away!"); scene.time.delayedCall(400, cleanup); });

  // cleanup wrapper to remove listeners
  const originalCleanup = cleanup;
  cleanup = function() {
    window.removeEventListener('keydown', onKeyDown);
    document.getElementById('btnA').removeEventListener('touchstart', onTouchA);
    document.getElementById('btnB').removeEventListener('touchstart', onTouchB);
    originalCleanup();
  };
}

/* Show the collection/pokedex */
function openCollection(scene) {
  inputLocked = true;
  const overlay = scene.add.rectangle(0,0, SCREEN_W, SCREEN_H, 0x000000, 0.7).setOrigin(0).setDepth(30);
  const panel = scene.add.rectangle(8,8, SCREEN_W-16, SCREEN_H-16, 0xffffff, 1).setOrigin(0).setDepth(31);
  const col = loadCollection();
  const title = scene.add.text(12,12, `Collection (${col.length})`, {font:'10px monospace', fill:'#000'}).setDepth(32);

  // list items (simple scroll if many)
  for (let i=0;i<Math.min(10,col.length);i++){
    const it = col[i];
    scene.add.text(12, 26 + i*10, `#${i+1} ${it.species} Lv${it.level}`, {font:'9px monospace', fill:'#000'}).setDepth(32);
  }
  if (col.length === 0) scene.add.text(12,26, "None yet — go catch some!", {font:'9px monospace', fill:'#000'}).setDepth(32);

  // close on any key or A/B
  function close() { overlay.destroy(); panel.destroy(); title.destroy(); scene.children.list.slice().filter(c=>c.depth>=32).forEach(c=>{ if (c && c.scene) c.destroy();}); inputLocked = false; window.removeEventListener('keydown', onKey); }
  function onKey(e){ if (e.key) close(); }
  window.addEventListener('keydown', onKey);
  document.getElementById('btnA').addEventListener('touchstart', close, { once:true });
  document.getElementById('btnB').addEventListener('touchstart', close, { once:true });
}

/* tiny floating text function */
function flashText(scene, text) {
  uiText.setText(text);
  scene.time.delayedCall(900, ()=> uiText.setText(''));
}

/* update status UI */
function updateUI() {
  const col = loadCollection();
  uiText.setText(`Collection: ${col.length}  |  [A] Interact  [B] Menu`);
}

/* Attach DOM-based touch controls to call grid movement and interaction */
function attachTouchControls(scene) {
  // map DOM dpad areas to move attempts
  const dpad = document.getElementById('dpad');
  dpad.addEventListener('touchstart', handleDpadTouch, { passive: true });
  dpad.addEventListener('touchend', (e)=>{}, { passive: true });

  function handleDpadTouch(e) {
    const t = e.touches[0];
    const target = document.elementFromPoint(t.clientX, t.clientY);
    if (!target) return;
    const dir = target.getAttribute('data-dir');
    if (!dir) return;
    if (dir === 'up') tryWalk(0,-1,scene);
    if (dir === 'down') tryWalk(0,1,scene);
    if (dir === 'left') tryWalk(-1,0,scene);
    if (dir === 'right') tryWalk(1,0,scene);
  }

  // Buttons
  const btnA = document.getElementById('btnA');
  const btnB = document.getElementById('btnB');
  btnA.addEventListener('touchstart', (e)=>{ e.preventDefault(); interact(scene); }, { passive: false });
  btnB.addEventListener('touchstart', (e)=>{ e.preventDefault(); openCollection(scene); }, { passive: false });

  // Keyboard fallback: also handle arrow keys and WASD for desktop testing
  window.addEventListener('keydown', (e)=>{
    if (inputLocked) return;
    if (player.moving) return;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') tryWalk(0,-1,scene);
    else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') tryWalk(0,1,scene);
    else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') tryWalk(-1,0,scene);
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') tryWalk(1,0,scene);
  });
}

/* --- Main update loop (minimal) --- */
function update(time, delta) {
  // nothing continuous required for now
}

</script>
