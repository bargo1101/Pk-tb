<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GBC-Style Tribute — Pat's Adventure</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
  <style>
    html,body { height:100%; margin:0; background:#12121a; font-family: monospace; -webkit-tap-highlight-color: transparent; }
    #game-wrapper { width: 320px; height: 288px; margin: 10px auto; image-rendering: pixelated; transform-origin:center top; }
    canvas { image-rendering: pixelated !important; }
    .dpad, .btnA, .btnB {
      position: fixed; opacity: 0.88; touch-action: none; user-select:none; -webkit-user-select:none;
    }
    .dpad { left: 4vw; bottom: 12vw; width: 20vw; height: 20vw; }
    .btnA { right: 6vw; bottom: 12vw; width: 16vw; height: 16vw; border-radius:50%; background:#2f7bd9; }
    .btnB { right: 22vw; bottom: 20vw; width: 10vw; height: 10vw; border-radius:50%; background:#d14a4a; }
    .dpad .dir { position:absolute; background:#999; border-radius:10%; opacity:0.75; }
    .dpad .up { left:34%; top:0; width:32%; height:30%; } 
    .dpad .down { left:34%; bottom:0; width:32%; height:30%; }
    .dpad .left { left:0; top:34%; width:30%; height:32%; } 
    .dpad .right { right:0; top:34%; width:30%; height:32%; }
    #hint { color:#dfe6e9; text-align:center; margin-top:4px; font-size:12px; }
    .small { font-size:11px; color:#cfe8ff; text-align:center; margin-bottom:2px; }
  </style>
</head>
<body>
  <div id="game-wrapper"></div>
  <div class="small">Player: Pat  —  Tribute (fan-made, original assets)</div>
  <div id="hint">D-Pad or arrows — [A] Interact / [B] Menu — Tap A on creatures to catch</div>

  <div class="dpad" id="dpad" aria-hidden="true">
    <div class="dir up" data-dir="up"></div>
    <div class="dir down" data-dir="down"></div>
    <div class="dir left" data-dir="left"></div>
    <div class="dir right" data-dir="right"></div>
  </div>
  <div class="btnA" id="btnA" aria-hidden="true"></div>
  <div class="btnB" id="btnB" aria-hidden="true"></div>

<script>
const TILE = 16;
const SCREEN_W = 160 * 2;
const SCREEN_H = 144 * 2;
const config = { 
  type: Phaser.CANVAS, 
  parent: 'game-wrapper', 
  width: SCREEN_W, 
  height: SCREEN_H, 
  backgroundColor: 0x88c0ff, 
  pixelArt: true, 
  physics: { default: 'arcade' }, 
  scene: { preload, create, update } 
};
const game = new Phaser.Game(config);

const maps = {
  overworld: [
    'TTTTTTTTTTTTTTTTTTTT',
    'T..................T',
    'T..C....g...S..N...T',
    'T..g..WWW..g...g...T',
    'T..g..W.W..g..C....T',
    'T..g..WWW..g.......T',
    'T.......g....g..D..T',
    'T..C....g....g.....T',
    'T.......g....g..C..T',
    'T..S........g......T',
    'T......BBBBBBBB....T',
    'TTTTTTTTDDDDTTTTTTT'
  ],
  house_small: [
    'BBBBBBBBBBBB',
    'B..........B',
    'B..S..N....B',
    'B..........B',
    'BD.........B',
    'BBBBBBBBBBBB'
  ]
};

const palette = {
  B: 0x304352,
  '.': 0xcff0d6,
  g: 0x77bb6d,
  W: 0x3f8fe2,
  T: 0x2c5b2e,
  D: 0xffd27f,
  N: 0xcfe3ff,
  C: 0xefd275,
  S: 0xffb7c5
};

let currentMapKey = 'overworld';
let currentMapData = maps.overworld;
let player, cursors, gameScene;
let creatures = [];
let npcs = [];
let items = [];
let playerPosBeforeEnter = null;
let inputLocked = false;

const collectionData = [];
const inventoryData = { stones: [] };

function makePixelTexture(scene, key, pixels, scale=2) {
  const sizeY = pixels.length, sizeX = pixels[0].length;
  const tex = scene.textures.createCanvas(key, sizeX*scale, sizeY*scale);
  const ctx = tex.getContext();
  for (let y=0;y<sizeY;y++){
    for (let x=0;x<sizeX;x++){
      const c = pixels[y][x];
      if (!c) continue;
      ctx.fillStyle = c;
      ctx.fillRect(x*scale, y*scale, scale, scale);
    }
  }
  tex.refresh();
}

function createSprites(scene) {
  makePixelTexture(scene, 'pat', [
    [null,'#0f2b4c','#0f2b4c','#0f2b4c','#0f2b4c',null],
    ['#0f2b4c','#77a6d9','#77a6d9','#77a6d9','#77a6d9','#0f2b4c'],
    [null,null,'#77a6d9','#77a6d9','#77a6d9',null],
    [null,null,null,'#f1c27d','#f1c27d',null],
    [null,null,'#e04a4a',null,null,'#e04a4a'],
    [null,'#e04a4a',null,null,null,'#e04a4a'],
  ], 2);

  makePixelTexture(scene, 'crea_base', [
    [null,'#a7d67b','#a7d67b','#a7d67b',null],
    ['#a7d67b','#ffffff','#ffffff','#ffffff','#a7d67b'],
    [null,'#ffffff','#7a9b4b','#ffffff',null],
    [null,null,'#7a9b4b',null,null]
  ], 3);

  makePixelTexture(scene, 'hakim_base', [
    [null,'#f0d2a4','#f0d2a4','#f0d2a4',null],
    ['#f0d2a4','#8a5d3a','#8a5d3a','#8a5d3a','#f0d2a4'],
    [null,'#8a5d3a','#fff0d6','#8a5d3a',null],
    [null,null,'#fff0d6',null,null]
  ],3);

  makePixelTexture(scene, 'hakim_fire', [
    [null,'#ffd29f','#ffd29f','#ffd29f',null],
    ['#ffd29f','#bf5a2a','#bf5a2a','#bf5a2a','#ffd29f'],
    [null,'#bf5a2a','#fff2d9','#bf5a2a',null],
    [null,null,'#fff2d9',null,null]
  ],3);
  
  makePixelTexture(scene, 'hakim_water', [
    [null,'#cfe6ff','#cfe6ff','#cfe6ff',null],
    ['#cfe6ff','#2b6fbf','#2b6fbf','#2b6fbf','#cfe6ff'],
    [null,'#2b6fbf','#eaf7ff','#2b6fbf',null],
    [null,null,'#eaf7ff',null,null]
  ],3);
  
  makePixelTexture(scene, 'hakim_volt', [
    [null,'#fff3a0','#fff3a0','#fff3a0',null],
    ['#fff3a0','#bda81c','#bda81c','#bda81c','#fff3a0'],
    [null,'#bda81c','#fff8c9','#bda81c',null],
    [null,null,'#fff8c9',null,null]
  ],3);

  makePixelTexture(scene, 'npc', [
    [null,'#ffd7b0','#ffd7b0',null],
    ['#ffd7b0','#6c4f3a','#6c4f3a','#ffd7b0'],
    [null,null,'#ffd7b0',null]
  ],3);
}

let renderTexture;
function drawMap(scene, mapKey) {
  currentMapKey = mapKey;
  currentMapData = maps[mapKey];
  
  creatures.forEach(c => {
    if (c.sprite) {
      if (c.sprite.moveTimer) c.sprite.moveTimer.remove(false);
      c.sprite.destroy();
    }
  });
  creatures = [];
  
  npcs.forEach(n => n.sprite && n.sprite.destroy());
  npcs = [];
  
  items.forEach(it => it.sprite && it.sprite.destroy());
  items = [];

  const mapW = currentMapData[0].length;
  const mapH = currentMapData.length;
  const pxW = mapW * TILE;
  const pxH = mapH * TILE;

  if (renderTexture) { 
    renderTexture.destroy(); 
    renderTexture = null; 
  }
  renderTexture = scene.add.renderTexture(0, 0, pxW, pxH).setOrigin(0).setDepth(0);
  
  for (let y=0;y<mapH;y++){
    for (let x=0;x<mapW;x++){
      const ch = currentMapData[y][x];
      const col = palette[ch] || palette['.'];
      const g = scene.make.graphics({x:0,y:0,add:false});
      g.fillStyle(col,1);
      g.fillRect(0,0,TILE,TILE);
      renderTexture.draw(g, x*TILE, y*TILE);
      g.destroy();
      
      const b = scene.make.graphics({x:0,y:0,add:false});
      b.lineStyle(1, 0x000000, 0.08);
      b.strokeRect(0,0,TILE,TILE);
      renderTexture.draw(b, x*TILE, y*TILE);
      b.destroy();

      if (ch === 'C') {
        const types = ['generic','hakim_hunt'];
        const type = Phaser.Utils.Array.GetRandom(types);
        spawnCreature(scene, x, y, type);
      } else if (ch === 'N') {
        spawnNPC(scene, x, y);
      } else if (ch === 'S') {
        spawnItem(scene, x, y, 'stone_spot');
      }
    }
  }

  scene.physics.world.setBounds(0,0,pxW,pxH);
  scene.cameras.main.setBounds(0,0,pxW,pxH);
}

function spawnCreature(scene, gx, gy, type) {
  let key = 'crea_base';
  let species = 'Dibbly';
  let level = Phaser.Math.Between(2,6);
  if (type === 'hakim_hunt') { 
    key = 'hakim_base'; 
    species = 'Hakim Jefrees'; 
    level = Phaser.Math.Between(2,5); 
  }
  const x = gx*TILE + TILE/2;
  const y = gy*TILE + TILE/2;
  const spr = scene.add.sprite(x,y,key).setScale(1).setDepth(3);
  spr.gridX = gx; 
  spr.gridY = gy; 
  spr.type = type; 
  spr.species = species; 
  spr.level = level;
  
  scene.tweens.add({ 
    targets: spr, 
    y: spr.y - 3, 
    duration: 900 + Math.random()*800, 
    yoyo:true, 
    repeat:-1, 
    ease:'Sine.easeInOut' 
  });
  
  spr.moveTimer = scene.time.addEvent({ 
    delay: 2000 + Math.random()*4000, 
    loop: true, 
    callback: ()=>{
      if (inputLocked) return;
      if (Math.random() < 0.5) return;
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      const d = Phaser.Utils.Array.GetRandom(dirs);
      const nx = spr.gridX + d[0], ny = spr.gridY + d[1];
      if (isWalkableTile(nx,ny)) {
        spr.gridX = nx; 
        spr.gridY = ny;
        scene.tweens.add({ 
          targets: spr, 
          x: nx*TILE + TILE/2, 
          y: ny*TILE + TILE/2, 
          duration: 300, 
          ease:'Power2' 
        });
      }
    }
  });
  creatures.push({ sprite: spr, species, level, type, key });
}

function spawnNPC(scene, gx, gy) {
  const x = gx*TILE + TILE/2; 
  const y = gy*TILE + TILE/2;
  const spr = scene.add.sprite(x,y,'npc').setScale(1.5).setDepth(4);
  spr.gridX = gx; 
  spr.gridY = gy;
  
  const dialogs = [
    ["Yo Pat! The Wi-Fi here is terrible, but the vibes are good."],
    ["Have you tried the new ramen truck? 10/10 would recommend."],
    ["I do data science. My hobby is training tiny beasts. Bring one around and I'll help it level up!"]
  ];
  
  const giveStone = Math.random() < 0.4;
  const stoneType = giveStone ? Phaser.Utils.Array.GetRandom(['fire','water','volt']) : null;
  npcs.push({ sprite: spr, dialogs, giveStone, stoneType, given:false });
}

function spawnItem(scene, gx, gy, subtype) {
  const x = gx*TILE + TILE/2; 
  const y = gy*TILE + TILE/2;
  const g = scene.add.circle(x, y, TILE/3, 0xffb7c5).setDepth(2);
  items.push({ sprite: g, gx, gy, subtype });
}

function isWalkableTile(gx, gy) {
  if (!currentMapData) return false;
  if (gy < 0 || gy >= currentMapData.length || gx < 0 || gx >= currentMapData[0].length) return false;
  const ch = currentMapData[gy][gx];
  return ['.','g','D','C','S','N'].includes(ch);
}

function tileCenter(gx,gy) { 
  return { x: gx*TILE + TILE/2, y: gy*TILE + TILE/2 }; 
}

function preload() {}

function create() {
  gameScene = this;
  createSprites(this);
  drawMap(this, 'overworld');

  const start = findFirstWalkableTile(currentMapData);
  const px = start.x*TILE + TILE/2, py = start.y*TILE + TILE/2;
  player = this.physics.add.sprite(px, py, 'pat').setDepth(5).setScale(1.2);
  player.gridX = start.x; 
  player.gridY = start.y;
  player.moving = false;
  this.cameras.main.centerOn(player.x, player.y);

  cursors = this.input.keyboard.createCursorKeys();
  this.input.keyboard.addKeys('W,A,S,D');
  this.input.keyboard.on('keydown-Z', ()=>interact());
  this.input.keyboard.on('keydown-SPACE', ()=>interact());
  this.input.keyboard.on('keydown-X', ()=>openMenu());
  
  attachTouchControls(this);

  this.info = this.add.text(6, SCREEN_H - 28, '', { 
    font: '10px monospace', 
    fill: '#061a2a', 
    backgroundColor:'#cff0ff' 
  }).setDepth(20).setScrollFactor(0);
  updateInfo();
}

function findFirstWalkableTile(mapData) {
  for (let y=0;y<mapData.length;y++) {
    for (let x=0;x<mapData[0].length;x++) {
      if (isWalkableChar(mapData[y][x])) return {x,y};
    }
  }
  return {x:1,y:1};
}

function isWalkableChar(ch) { 
  return ['.','g','D','C','S','N'].includes(ch); 
}

function stepTo(dx,dy) {
  if (inputLocked || player.moving) return;
  const nx = player.gridX + dx, ny = player.gridY + dy;
  if (!isWalkableTile(nx,ny)) {
    flashTemporary("Blocked!");
    return;
  }
  player.moving = true;
  player.gridX = nx; 
  player.gridY = ny;
  const dest = tileCenter(nx,ny);
  gameScene.tweens.add({ 
    targets: player, 
    x: dest.x, 
    y: dest.y, 
    duration: 150, 
    ease: 'Power2', 
    onComplete: ()=>{
      player.moving=false; 
      gameScene.cameras.main.centerOn(player.x, player.y); 
      onEnterTile(nx,ny);
    }
  });
}

function onEnterTile(gx,gy) {
  const ch = currentMapData[gy][gx];
  if (ch === 'D') {
    if (currentMapKey === 'overworld') {
      playerPosBeforeEnter = { mapKey: currentMapKey, x: gx, y: gy };
      drawMap(gameScene, 'house_small');
      const insideTile = {x: 1, y: 3};
      player.gridX = insideTile.x; 
      player.gridY = insideTile.y;
      const dest = tileCenter(player.gridX, player.gridY);
      player.x = dest.x; 
      player.y = dest.y;
      gameScene.cameras.main.centerOn(player.x, player.y);
      updateInfo();
    } else {
      const prev = playerPosBeforeEnter || { mapKey:'overworld', x:3, y:6 };
      drawMap(gameScene, prev.mapKey);
      const outX = Math.max(1, prev.x);
      player.gridX = outX; 
      player.gridY = prev.y;
      const dest = tileCenter(player.gridX, player.gridY);
      player.x = dest.x; 
      player.y = dest.y;
      gameScene.cameras.main.centerOn(player.x, player.y);
      updateInfo();
    }
  }

  const foundItemIndex = items.findIndex(it => it.gx === gx && it.gy === gy);
  if (foundItemIndex >= 0) {
    const it = items[foundItemIndex];
    if (it.subtype === 'stone_spot') {
      const stone = Phaser.Utils.Array.GetRandom(['fire','water','volt']);
      inventoryData.stones.push(stone);
      it.sprite.destroy();
      items.splice(foundItemIndex,1);
      flashTemporary(`Found a ${stone} stone!`);
      updateInfo();
    }
  }
}

function interact() {
  if (inputLocked) return;
  
  for (let i=0;i<creatures.length;i++){
    const c = creatures[i];
    const d = Math.abs(c.sprite.gridX - player.gridX) + Math.abs(c.sprite.gridY - player.gridY);
    if (d <= 1) {
      startEncounter(c, i);
      return;
    }
  }
  
  for (let i=0;i<npcs.length;i++){
    const n = npcs[i];
    const d = Math.abs(n.sprite.gridX - player.gridX) + Math.abs(n.sprite.gridY - player.gridY);
    if (d <= 1) {
      talkToNPC(n);
      return;
    }
  }
  
  flashTemporary("Nothing to interact with.");
}

function startEncounter(creatureObj, index) {
  inputLocked = true;
  const spr = creatureObj.sprite;
  
  const overlay = gameScene.add.rectangle(0,0, SCREEN_W, SCREEN_H, 0x000000, 0.6).setOrigin(0).setDepth(50);
  const panel = gameScene.add.rectangle(8, SCREEN_H-60, SCREEN_W-16, 56, 0xf8f8f8, 1).setOrigin(0).setDepth(51);
  const title = gameScene.add.text(12, SCREEN_H-56, `${spr.species} Lv ${spr.level}`, { 
    font:'10px monospace', 
    fill:'#000' 
  }).setDepth(52);
  const info = gameScene.add.text(12, SCREEN_H-40, "Throw Ball [A]  Run [B]", { 
    font:'9px monospace', 
    fill:'#000' 
  }).setDepth(52);

  let cleanupDone = false;
  
  function cleanup() {
    if (cleanupDone) return;
    cleanupDone = true;
    overlay.destroy(); 
    panel.destroy(); 
    title.destroy(); 
    info.destroy();
    inputLocked = false;
    window.removeEventListener('keydown', onKey);
    document.getElementById('btnA').removeEventListener('touchstart', onTouchA);
    document.getElementById('btnB').removeEventListener('touchstart', onTouchB);
  }
  
  function attemptCapture() {
    const base = spr.species === 'Hakim Jefrees' ? 0.45 : 0.5;
    const levelFactor = Math.max(0, (8 - spr.level) * 0.04);
    const chance = Phaser.Math.Clamp(base + levelFactor - Math.random()*0.15, 0.05, 0.95);
    info.setText("You throw a ball...");
    gameScene.time.delayedCall(700, ()=>{
      if (Math.random() < chance) {
        info.setText(`${spr.species} was captured!`);
        const entry = { 
          species: spr.species, 
          level: spr.level, 
          id: Date.now(), 
          xp: 0 
        };
        if (spr.species === 'Hakim Jefrees') entry.element = 'neutral';
        collectionData.push(entry);
        
        if (spr.moveTimer) spr.moveTimer.remove(false);
        spr.destroy();
        creatures.splice(index,1);
        gameScene.time.delayedCall(900, ()=>{ 
          cleanup(); 
          updateInfo(); 
        });
      } else {
        info.setText("It broke free!");
        gameScene.time.delayedCall(700, ()=> cleanup());
      }
    });
  }

  function onKey(e){ 
    if (!inputLocked) return; 
    if (e.key==='z' || e.key==='Z' || e.key===' '){ 
      attemptCapture(); 
    } else if (e.key==='x' || e.key==='X'){ 
      info.setText("You ran away!"); 
      gameScene.time.delayedCall(300, cleanup); 
    } 
  }
  
  function onTouchA(e) {
    e.preventDefault();
    attemptCapture();
  }
  
  function onTouchB(e) {
    e.preventDefault();
    info.setText("You ran away!"); 
    gameScene.time.delayedCall(300, cleanup);
  }
  
  window.addEventListener('keydown', onKey);
  document.getElementById('btnA').addEventListener('touchstart', onTouchA);
  document.getElementById('btnB').addEventListener('touchstart', onTouchB);
}

function talkToNPC(npc) {
  inputLocked = true;
  const dialogLines = Phaser.Utils.Array.Shuffle([...npc.dialogs])[0];
  let idx = 0;
  const overlay = gameScene.add.rectangle(0,0, SCREEN_W, SCREEN_H, 0x000000, 0.55).setOrigin(0).setDepth(60);
  const panel = gameScene.add.rectangle(8, SCREEN_H-70, SCREEN_W-16, 66, 0xfafafa, 1).setOrigin(0).setDepth(61);
  const nameTxt = gameScene.add.text(12, SCREEN_H-66, `NPC`, {
    font:'10px monospace', 
    fill:'#000'
  }).setDepth(62);
  const body = gameScene.add.text(12, SCREEN_H-52, dialogLines[idx] || "Hey.", {
    font:'9px monospace', 
    fill:'#000'
  }).setDepth(62);
  const hint = gameScene.add.text(SCREEN_W-70, SCREEN_H-34, "[A] Next  [B] Close", {
    font:'9px monospace', 
    fill:'#333'
  }).setDepth(62);

  let cleanupDone = false;

  function advance() {
    idx++;
    if (idx < dialogLines.length) { 
      body.setText(dialogLines[idx]); 
    } else {
      finish();
    }
  }
  
  function finish() {
    if (npc.giveStone && !npc.given) {
      const stone = npc.stoneType;
      inventoryData.stones.push(stone);
      npc.given = true;
      body.setText(`Oh hey, take this ${stone} stone. Use it on a Hakim Jefrees!`);
      gameScene.time.delayedCall(800, ()=>{ 
        close(); 
        updateInfo(); 
      });
      return;
    }
    close();
  }
  
  function close() { 
    if (cleanupDone) return;
    cleanupDone = true;
    overlay.destroy(); 
    panel.destroy(); 
    nameTxt.destroy(); 
    body.destroy(); 
    hint.destroy(); 
    inputLocked=false; 
    window.removeEventListener('keydown', onKey);
    document.getElementById('btnA').removeEventListener('touchstart', onTouchA);
    document.getElementById('btnB').removeEventListener('touchstart', onTouchB);
  }

  function onKey(e){ 
    if (!inputLocked) return; 
    if (e.key==='z' || e.key==='Z' || e.key===' '){ 
      advance(); 
    } else if (e.key==='x' || e.key==='X'){ 
      close(); 
    } 
  }
  
  function onTouchA(e) {
    e.preventDefault();
    advance();
  }
  
  function onTouchB(e) {
    e.preventDefault();
    close();
  }
  
  window.addEventListener('keydown', onKey);
  document.getElementById('btnA').addEventListener('touchstart', onTouchA);
  document.getElementById('btnB').addEventListener('touchstart', onTouchB);
}

function flashTemporary(txt) {
  if (!gameScene) return;
  gameScene.info.setText(txt);
  gameScene.time.delayedCall(1100, ()=>{ 
    if (gameScene && gameScene.info) updateInfo(); 
  });
}

function updateInfo() {
  const stones = inventoryData.stones.length;
  const col = collectionData.length;
  if (gameScene && gameScene.info) {
    gameScene.info.setText(`Pat  •  Collected: ${col}  •  Stones: ${stones}`);
  }
}

function openMenu() {
  inputLocked = true;
  const overlay = gameScene.add.rectangle(0,0, SCREEN_W, SCREEN_H, 0x000000, 0.7).setOrigin(0).setDepth(80);
  const panel = gameScene.add.rectangle(6,6, SCREEN_W-12, SCREEN_H-12, 0xfdfdfd, 1).setOrigin(0).setDepth(81);
  const title = gameScene.add.text(12,10, "PAT'S MENU", {
